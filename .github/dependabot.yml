version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Major bumps break the flat config pairing; @eslint/js must match eslint's version.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # react and react-dom must stay on the same version; bump them together manually.
      - dependency-name: react
      - dependency-name: react-dom
  - package-ecosystem: cargo
    directory: /contracts/hyperdrome
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Rust is pinned to 1.93.0 (SPEC.md section 15); the action ref is the toolchain version.
      - dependency-name: dtolnay/rust-toolchain
