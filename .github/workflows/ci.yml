name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      # Test database: the schema comes from the committed migration (npm run db:migrate).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
        with:
          # format:check and lint scope files against the pre-hackathon tag.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          # Same version as the local pre-commit hook (docs/runbooks/dev-setup.md). The action's
          # default (8.24.3) ignores the [[allowlists]] syntax in .gitleaks.toml.
          GITLEAKS_VERSION: '8.30.1'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm audit
        run: npm audit --audit-level=high

  contract:
    # hashFiles is not available in a job-level `if`, so each step checks for the contract.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/hyperdrome
    steps:
      - uses: actions/checkout@v7
      - name: Contract present?
        id: detect
        working-directory: .
        run: echo "present=${{ hashFiles('contracts/hyperdrome/Cargo.toml') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/hyperdrome
      - if: steps.detect.outputs.present == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # The sandbox tests build the wasm through cargo-near-build, which runs `cargo near`.
      - if: steps.detect.outputs.present == 'true'
        name: Install cargo-near 0.22.0
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - if: steps.detect.outputs.present == 'true'
        run: cargo fmt --check
      # near-sdk 5.27+ refuses a plain host build of a contract crate, so `cargo clippy` without
      # a target cannot compile. Lint the wasm contract build and the host test build instead.
      - if: steps.detect.outputs.present == 'true'
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - if: steps.detect.outputs.present == 'true'
        run: cargo clippy --all-targets -- -D warnings
      - if: steps.detect.outputs.present == 'true'
        run: cargo test
      - if: steps.detect.outputs.present == 'true'
        run: cargo audit
