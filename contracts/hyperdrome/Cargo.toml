[package]
name = "hyperdrome"
description = "Hyperdrome on NEAR: drones, skins, mods, Volts, marketplace and race settlement in one contract."
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
license = "MIT"
# NEP-0330 source metadata (`contract_source_metadata` view) links here.
repository = "https://github.com/Ali-Atlas/hyperdrome"

[lib]
crate-type = ["cdylib", "rlib"]

# Reproducible-build settings from the `cargo near new` template (NEP-0330). Deploys in this
# project use `build-non-reproducible-wasm` with the pinned 1.93.0 toolchain.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
near-sandbox = "=0.4.0"
near-api = "=0.8.7"
cargo-near-build = "=0.11.5"
tokio = { version = "1", features = ["full"] }
testresult = "0.4.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.bench]
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
